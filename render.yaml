# Render Blueprint — deploys the Flask app with real Spotify counts.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: stream-city
    runtime: python
    plan: free
    branch: claude/laughing-rubin-fm8819
    buildCommand: pip install -r requirements.txt
    # long timeout: large playlists resolve many albums sequentially
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    envVars:
      - key: SOURCE
        value: spotify
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Auth (enter in the dashboard, never committed). For a first test the
      # simplest is a captured bearer token + client-token (they expire ~1h).
      # The query hashes are baked into spotify_client.py as defaults.
      - key: SP_DC
        sync: false                 # sp_dc cookie (cookie path; may need TOTP)
      - key: SP_ACCESS_TOKEN
        sync: false                 # captured "Bearer <token>" value (quick test)
      - key: SP_CLIENT_TOKEN
        sync: false                 # captured client-token header value
